<!DOCTYPE html>

<html class="dark" lang="en"><head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>UNYX | Coming Soon</title>
        <script
            src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;700;900&amp;display=swap"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet" />
        <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
        <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .tech-grid {
            background-image: 
                linear-gradient(to right, #111 1px, transparent 1px),
                linear-gradient(to bottom, #111 1px, transparent 1px);
            background-size: 40px 40px;
        }
        @keyframes pulse-opacity {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        .animate-pulse-slow {
            animation: pulse-opacity 3s ease-in-out infinite;
        }
    </style>
    </head>
    <body
        class="bg-background-light dark:bg-background-dark text-white font-display overflow-hidden">
        <!-- Background Layer -->
        <div
            class="fixed inset-0 z-0 tech-grid pointer-events-none opacity-40"></div>
        <div
            class="fixed inset-0 z-0 bg-radial-gradient from-transparent via-black/50 to-black pointer-events-none"
            style="background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);"></div>
        <div
            class="relative z-10 flex h-screen w-full flex-col items-center justify-center px-4">
            <!-- Top Nav Bar (Minimal Version) -->
            <header
                class="fixed top-0 left-0 w-full flex items-center justify-between px-8 py-6 md:px-12">

            </header>
            <!-- Main Hero Section -->
            <main
                class="flex flex-col items-center justify-center max-w-4xl w-full text-center">
                <!-- Central Branding Container -->
                <div class="flex flex-col items-center gap-8">
                    <!-- Logo with subtle glow -->

                    <div class="flex flex-col gap-4">

                        <div class="flex items-center">
                            <img src="logo.png" alt="UNYX Solutions"
                                class="h-16" />
                        </div>
                        <div class="flex flex-col gap-2 items-center">
                            <h2
                                class="text-white/40 text-sm md:text-base font-light tracking-[0.5em] uppercase animate-pulse-slow">
                                coming soon
                            </h2>
                        </div>
                    </div>

                    <div class="mt-8">
                        <button
                            class="group relative flex items-center justify-center px-8 py-3 bg-transparent text-white text-xs font-bold tracking-widest uppercase border border-white/20 hover:border-primary transition-all duration-300 rounded-full overflow-hidden">
                            <div
                                class="absolute inset-0 bg-primary translate-y-[101%] group-hover:translate-y-0 transition-transform duration-300"></div>
                            <span
                                class="relative z-10 group-hover:text-white">Notify
                                Me</span>
                        </button>
                    </div>
                </div>
            </main>
            <!-- Progress Footer Section -->
            <footer
                class="fixed bottom-0 left-0 w-full flex flex-col items-center gap-6 pb-8">
                <!-- Progress Bar -->
                <div class="w-full max-w-xl px-10">
                    <div class="flex justify-between items-end mb-2">
                        <span
                            class="text-[10px] text-white/30 uppercase tracking-widest font-bold">System
                            Initialization</span>
                        <span
                            class="text-[10px] text-primary font-bold tracking-widest">72%</span>
                    </div>
                    <div
                        class="w-full h-[1px] bg-white/10 relative overflow-hidden">
                        <div
                            class="absolute top-0 left-0 h-full bg-primary shadow-[0_0_10px_#135bec]"
                            style="width: 72%;"></div>
                    </div>
                </div>
                <!-- Footer Meta -->
                <div class="flex flex-col items-center gap-4 text-center">
                    <div class="flex gap-8">
                        <a
                            class="text-white/20 hover:text-white transition-colors"
                            href="#">
                            <span
                                class="material-symbols-outlined text-[18px]">share</span>
                        </a>
                        <a
                            class="text-white/20 hover:text-white transition-colors"
                            href="#">
                            <span
                                class="material-symbols-outlined text-[18px]">alternate_email</span>
                        </a>
                        <a
                            class="text-white/20 hover:text-white transition-colors"
                            href="#">
                            <span
                                class="material-symbols-outlined text-[18px]">public</span>
                        </a>
                    </div>
                    <p
                        class="text-[10px] text-white/20 uppercase tracking-[0.2em]">
                        © 2024 UNYX Solutions S.A.S. | All Rights Reserved.
                    </p>
                </div>
            </footer>
        </div>
        <!-- Background Accents (Subtle abstract shapes) -->
        <div
            class="fixed top-1/4 -left-20 size-[500px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
        <div
            class="fixed bottom-1/4 -right-20 size-[500px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
    </body></html>
